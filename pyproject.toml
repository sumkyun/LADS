[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lads"
version = "0.1.0"
description = "Minimal release code for the LADS Ansatz-to-Atom model"
requires-python = ">=3.10"
dependencies = [
  "numpy==2.2.6",
  "scipy>=1.15,<2",
  "sympy==1.14.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
